[package]
name = "transfer-agent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "25.3.0"

[dev-dependencies]
soroban-sdk = { version = "25.3.0", features = ["testutils"] }

# Sem gate de rede (F-006): o agente não tem endereço de USDC embutido — ele
# administra os SACs que o admin registrar. `testing` existe só para os testes.
[features]
default = ["testing"]
testing = []

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
