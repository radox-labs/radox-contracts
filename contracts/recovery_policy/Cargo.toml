[package]
name = "recovery-policy"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "25.3.0"

[dev-dependencies]
soroban-sdk = { version = "25.3.0", features = ["testutils"] }

# Piso da espera por rede (a única coisa que muda entre redes). Default `testing`
# para `cargo test`; WASM sai SÓ com `--no-default-features --features testnet|mainnet`.
# mainnet: espera mínima de 7 dias gravada no binário.
[features]
default = ["testing"]
testnet = []
mainnet = []
testing = []

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
